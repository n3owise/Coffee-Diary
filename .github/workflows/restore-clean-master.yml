name: Restore Clean Master Sheet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEET_ID: "1q7mjRmjI8ywrSXe1OU6oZ2jNOib0KHNoEK7i8rUH0vg"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore clean master sheet
        run: python restore_clean_master.py
